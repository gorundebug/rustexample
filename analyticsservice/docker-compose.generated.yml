services:
  analyticsservice:
    image: analyticsservice-rust:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        CARGO_REGISTRIES_CRATES_IO_INDEX: ${CARGO_REGISTRIES_CRATES_IO_INDEX:-https://github.com/rust-lang/crates.io-index}
        DEPENDENCY_MAVEN_CENTRAL_URL: ${DEPENDENCY_MAVEN_CENTRAL_URL:-https://repo1.maven.org/maven2}
        DEPENDENCY_APT_DEBIAN_URL: ${DEPENDENCY_APT_DEBIAN_URL:-}
        DEPENDENCY_APT_DEBIAN_SECURITY_URL: ${DEPENDENCY_APT_DEBIAN_SECURITY_URL:-}
      additional_contexts:
        rustservicelib-source: "${RUSTSERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/rustservicelib.git#v0.2.80}"
        module-model_rust-source: "${EXAMPLE_MODEL_SOURCE_CONTEXT:-https://github.com/gorundebug/rustexample.git#v0.2.80}"
    environment:
      - DEBUG=${DEBUG:-0}
      - ANALYTICS_SERVICE_HTTP_PORT
      - ANALYTICS_SERVICE_GRPC_PORT
    ports:
      - "${ANALYTICS_SERVICE_HOST_HTTP_PORT:-9093}:${ANALYTICS_SERVICE_HTTP_PORT:-9093}"
      - "${ANALYTICS_SERVICE_HOST_GRPC_PORT:-9203}:${ANALYTICS_SERVICE_GRPC_PORT:-9203}"