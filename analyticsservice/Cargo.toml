[package]
name = "analytics_service"
version = "0.2.142"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
async-trait = "0.1"
mimalloc = "0.1"
futures-util = "0.3"
croner = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servicelib-gorundebug = { git = "https://github.com/gorundebug/rustservicelib.git", tag = "v0.2.142" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.12"
tracing = "0.1"
example-model = { git = "https://github.com/gorundebug/rustexample.git", tag = "v0.2.142" }
opentelemetry = "0.32"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
