services:
  inventoryservice:
    image: inventoryservice-rust-development:latest
    build:
      target: development
    working_dir: /workspace/service
    command:
      - /bin/sh
      - -c
      - |
        prepare-local-build /workspace/source /workspace/service
        cargo build
        service_binary="$(sed -n '/^\[package\]/,/^\[/s/^name = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
        test -n "$$service_binary"
        if [ "$${DEBUG:-0}" = "1" ]; then
          exec gdbserver :2345 "target/debug/$$service_binary" --config config/config.yaml --values config/overrides.yaml
        fi
        exec "target/debug/$$service_binary" --config config/config.yaml --values config/overrides.yaml
    volumes:
      - .:/workspace/source:ro
      - rust-worktree:/workspace/service
      - rust-cargo-registry:/usr/local/cargo/registry
      - rust-cargo-git:/usr/local/cargo/git
      - rust-target:/workspace/service/target

volumes:
  rust-worktree:
  rust-cargo-registry:
  rust-cargo-git:
  rust-target: