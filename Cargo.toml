[workspace]
resolver = "2"
members = [
    "analyticsservice",
    "inventory_service_api",
    "inventoryservice",
    "model",
    "order_service_api",
    "orderservice",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.12"

[workspace.dependencies]
async-trait = "0.1"
mimalloc = "0.1"
opentelemetry = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.12"
tracing = "0.1"
tracing-opentelemetry = "0.33"
uuid = { version = "1", features = ["v4"] }
