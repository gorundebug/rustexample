[workspace]
resolver = "2"
members = [
    "analyticsservice",
    "inventory_service_api",
    "inventoryservice",
    "model_rust",
    "order_service_api",
    "orderservice",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.2.88"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.12"
tracing = "0.1"
[patch."https://github.com/gorundebug/rustexample.git"]
inventory-service-api = { path = "inventory_service_api" }
example-model = { path = "model_rust" }
order-service-api = { path = "order_service_api" }